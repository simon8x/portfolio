<script>

    var g1content = document.getElementById('g1content');

    var g4content = document.getElementById('g4content');
    var g4btn = document.getElementById('g4btn');
    var clickLayers = document.getElementsByClassName('click-layer');

    function openGame1(){
        game1.classList.remove("restore-from-big","restore-from-cero");
        game1.classList.add("grow-hero-game");
        game2.classList.add("colapse-hero-game");
        game3.classList.add("colapse-hero-game");
        game4.classList.add("colapse-hero-game");
        g1close.classList.remove("hidder");
        g1close.classList.add("appear");
        g1btn.classList.remove("hidder");
        g1btn.classList.add("appear");
        g1content.classList.remove("grow-container");
        g1content.classList.add("restore-container");
        for (let i = 0; i < clickLayers.length; i++) {
            clickLayers[i].style.pointerEvents = "none";
        }
    }

    function closeGame1(){
        game1.classList.remove("grow-hero-game");
