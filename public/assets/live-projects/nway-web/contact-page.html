<!DOCTYPE html>
<html>
<head>
<title>TEAM</title>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<div class="shapes-container">
    <div class="blurred-shape magenta"></div>
    <div class="blurred-shape cyan"></div>

    <div class="blurred-shape magenta shape1"></div>
    <div class="blurred-shape cyan shape2"></div>

    <div class="blurred-shape magenta shape3"></div>
    <div class="blurred-shape cyan shape4"></div>

    <div class="blurred-shape magenta shape5"></div>
    <div class="blurred-shape cyan shape6"></div>

    <div class="blurred-shape magenta shape7"></div>
    <div class="blurred-shape cyan shape8"></div>

    <div class="blurred-shape magenta shape9"></div>
    <div class="blurred-shape cyan shape10"></div>

    <section class="hero-contact-section">
        <div class="hero-background-container">
            <img class="res-img hero-backgrond__img" src="assets/images/team-page-hero-background.png">
        </div>
        <div class="container">
            <div class="hero-wrapper">
                <h1 class="hero__title">Reach out and let’s connect.</h1>
            </div>
        </div>
    </section>
    <section class="indication-section">
        <div class="container">
            <div class="indication-wrapper">
                <img class="res-img indication__img" src="assets/images/mouse-v.png">
            </div>
        </div>
    </section>
    <section class="contact-form-section">
        <div class="container">
            <div class="hero-wrapper">
                <h1 class="hero__title">contact form goes here</h1>
            </div>
        </div>
    </section>
    <section class="socialmedia-section">
        <div class="container">
            <ul class="socialmedia__list">
                <li class="socialmedia__items">
                    <a class="socialmedia__link" href="#">
                        instagram
                    </a>
                </li>
                <li class="socialmedia__items">
                    <a class="socialmedia__link" href="#">
                        twitter
                    </a>
                </li>
                <li class="socialmedia__items">
                    <a class="socialmedia__link" href="#">
                        facebook
                    </a>
                </li>
                <li class="socialmedia__items">
                    <a class="socialmedia__link" href="#">
                        linkedin
                    </a>
                </li>
            </ul>
            <div class="title-wrapper">
                <h1 class="title">
                    Other ways of contact:
                </h1>
            </div>
            <div class="contact-wrapper">
                <div class="contact-col">
                    <h4 class="contact-col__title">Media Inquiries</h4>
                    <a class="adress" mailto="press@nway.com">press@nway.com</a>
                    <a class="adress">Media Kit</a>
                </div>
                <div class="contact-col">
                    <h4 class="contact-col__title">Support</h4>
                    <a class="adress"  mailto="partnerships@nway.com">partnerships@nway.com</a>
                </div>
                <div class="contact-col">
                    <h4 class="contact-col__title">Business Inquiries</h4>
                    <a class="adress" href="support.nwayplay.com">support.nwayplay.com</a>
                </div>
            </div>
        </div>
    </section>



</div>





<script src="assets/js/nway-demo-chrome.js"></script>
</body>
</html>
